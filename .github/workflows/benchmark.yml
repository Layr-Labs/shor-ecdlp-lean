name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    outputs:
      score: ${{ steps.score.outputs.value }}

    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true

      - name: Verify submission surface
        if: startsWith(github.ref, 'refs/heads/submissions/')
        shell: bash
        run: |
          set -euo pipefail

          read -r -a commit_line <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if (( ${#commit_line[@]} != 2 )); then
            echo "Submission must be a single-parent commit" >&2
            exit 1
          fi

          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              ShorECDLP/Submission/Entrant|ShorECDLP/Submission/Entrant/*) ;;
              *)
                echo "Submission changed a non-editable path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --no-renames --name-only -z "$GITHUB_SHA^" "$GITHUB_SHA")

      - name: Restore trusted cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
            .lake/trusted-oleans.sha256
          key: shor-ecdlp-lean-trusted-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'setup.sh', 'ShorECDLP.lean', 'ShorECDLP/Framework/**', 'ShorECDLP/Math/**', 'ShorECDLP/Challenge/**', 'ShorECDLP/Judge/**', 'ShorECDLP/Submission/Naive/**', 'ShorECDLP/Submission/2607_13816/**', 'scripts/**') }}
          # Exact-key lookups on Blacksmith intermittently miss; fall back to the newest trusted
          # entry and let setup.sh rebuild only what is stale. Bump v1 here and in key together.
          restore-keys: shor-ecdlp-lean-trusted-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./setup.sh

      # Save trusted builds before candidate verification, even if the proof fails.
      # Only the default branch publishes caches shared with submission branches.
      - name: Save trusted cache
        if: steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
            .lake/trusted-oleans.sha256
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Benchmark
        shell: bash
        run: ./benchmark.sh

      - name: Report score
        id: score
        shell: bash
        run: |
          set -euo pipefail

          jq -e '.score | type == "number"' scripts/score.json > /dev/null
          score=$(jq -er '.scoreExact | select(type == "string" and test("^[1-9][0-9]*$"))' scripts/score.json)
          t_count=$(jq -er '.metrics.tCount | select(type == "number")' scripts/score.json)
          qubits=$(jq -er '.metrics.qubits | select(type == "number")' scripts/score.json)
          toffoli=$(jq -er '.metrics.toffoli | select(type == "number")' scripts/score.json)
          measurements=$(jq -er '.metrics.measurements | select(type == "number")' scripts/score.json)
          echo "value=$score" >> "$GITHUB_OUTPUT"
          {
            echo "## Benchmark results"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Score | \`$score\` |"
            echo "| T-count | \`$t_count\` |"
            echo "| Qubits | \`$qubits\` |"
            echo "| Toffoli | \`$toffoli\` |"
            echo "| Measurements | \`$measurements\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Benchmark score: $score"
          echo "T-count: $t_count"
          echo "Qubits: $qubits"
          echo "Toffoli: $toffoli"
          echo "Measurements: $measurements"

      - name: Upload score
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-score
          path: scripts/score.json
          if-no-files-found: error
          retention-days: 30
