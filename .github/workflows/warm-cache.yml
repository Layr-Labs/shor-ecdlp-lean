name: Warm verifier cache
# Yukon dispatches benchmark.yml on baseline and submission branches. Those runs can restore
# caches saved on the default branch but never save their own, so this workflow publishes the
# trusted build from master. Submissions hit only while master's key inputs match the benchmark's
# imported commit. Rewarm after eviction with `gh workflow run warm-cache.yml --ref master`.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - lean-toolchain
      - lake-manifest.json
      - lakefile.lean
      - setup.sh
      - ShorECDLP.lean
      - "ShorECDLP/Framework/**"
      - "ShorECDLP/Math/**"
      - "ShorECDLP/Challenge/**"
      - "ShorECDLP/Judge/**"
      - "ShorECDLP/Submission/Naive/**"
      - "ShorECDLP/Submission/2607_13816/**"
      - "scripts/**"
      - .github/workflows/warm-cache.yml

permissions:
  contents: read

concurrency:
  group: warm-verifier-cache
  cancel-in-progress: false

jobs:
  warm:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      # Submissions restore with the key computed in benchmark.yml; a different key here would
      # publish an entry nobody reads.
      - name: Cache keys match benchmark.yml
        run: |
          field() { grep -m1 -E "^ +$2: shor-ecdlp-lean-trusted-v1-" "$1" | sed -E 's/^ +//'; }
          for name in key restore-keys; do
            test -n "$(field .github/workflows/benchmark.yml "$name")"
            test "$(field .github/workflows/benchmark.yml "$name")" = "$(field .github/workflows/warm-cache.yml "$name")"
          done
          # restore-keys must stay a prefix of key so a version bump cannot fall back to old entries.
          key="$(field .github/workflows/benchmark.yml key)"
          restore="$(field .github/workflows/benchmark.yml restore-keys)"
          [[ "${key#key: }" == "${restore#restore-keys: }"* ]]

      - name: Restore trusted cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
            .lake/trusted-oleans.sha256
          key: shor-ecdlp-lean-trusted-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'setup.sh', 'ShorECDLP.lean', 'ShorECDLP/Framework/**', 'ShorECDLP/Math/**', 'ShorECDLP/Challenge/**', 'ShorECDLP/Judge/**', 'ShorECDLP/Submission/Naive/**', 'ShorECDLP/Submission/2607_13816/**', 'scripts/**') }}
          # Exact-key lookups on Blacksmith intermittently miss; fall back to the newest trusted
          # entry and let setup.sh rebuild only what is stale. Bump v1 here and in key together.
          restore-keys: shor-ecdlp-lean-trusted-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./setup.sh

      - name: Save trusted cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
            .lake/trusted-oleans.sha256
          key: ${{ steps.cache.outputs.cache-primary-key }}
